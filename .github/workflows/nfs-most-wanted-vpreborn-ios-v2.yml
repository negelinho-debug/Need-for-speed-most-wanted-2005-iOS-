  xcode_build:
    name: 2. Build unsigned IPA on macOS
    needs: recover_and_export
    if: needs.recover_and_export.outputs.xcode_ready == 'true'
    runs-on: macos-15
    timeout-minutes: 120

    steps:

      - name: Download Xcode project
        uses: actions/download-artifact@v4
        with:
          name: NFS-MW-VPREBORN-iOS-v3.7-Xcode
          path: xcode-artifact

      - name: Extract Xcode project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            xcode

          tar \
            -xzf \
              xcode-artifact/NFS-MW-VPREBORN-iOS-v3.7-Xcode.tar.gz \
            -C \
              xcode

          find xcode \
            -maxdepth 4 \
            \( \
              -name '*.xcodeproj' \
              -o -name '*.xcworkspace' \
            \) \
            -print

      - name: Patch project for Xcode 16 and remove old ARM flags
        shell: bash
        run: |
          set -euo pipefail

          echo \
            "===== XCODE VERSION ====="

          xcodebuild \
            -version

          echo \
            "===== -mno-thumb BEFORE PATCH ====="

          grep -RIn \
            -- '-mno-thumb' \
            xcode \
            || true

          python3 - <<'PY'
          from pathlib import Path

          root = Path("xcode")

          changed = []

          for p in root.rglob("*"):

              if not p.is_file():
                  continue

              if not (
                  p.name == "project.pbxproj"
                  or
                  p.suffix == ".xcconfig"
              ):
                  continue

              try:
                  s = p.read_text(
                      encoding="utf-8"
                  )
              except UnicodeDecodeError:
                  continue

              old = s

              count = s.count(
                  "-mno-thumb"
              )

              if count:

                  print(
                      "Removing",
                      count,
                      "x -mno-thumb from",
                      p
                  )

                  s = s.replace(
                      "-mno-thumb",
                      ""
                  )

              s = s.replace(
                  "IPHONEOS_DEPLOYMENT_TARGET = 8.0;",
                  "IPHONEOS_DEPLOYMENT_TARGET = 12.0;"
              )

              s = s.replace(
                  "ENABLE_BITCODE = YES;",
                  "ENABLE_BITCODE = NO;"
              )

              if s != old:

                  p.write_text(
                      s,
                      encoding="utf-8"
                  )

                  changed.append(
                      str(p)
                  )

          print(
              "Patched Xcode files:",
              len(changed)
          )

          for p in changed:
              print(
                  " ",
                  p
              )
          PY

          echo \
            "===== -mno-thumb AFTER FIRST PATCH ====="

          if grep -RIn \
            -- '-mno-thumb' \
            xcode
          then
            echo \
              "::error::-mno-thumb still exists."
            exit 1
          fi

          PBX="$(
            find xcode \
              -type f \
              -path '*/project.pbxproj' \
              -print \
              | head -1
          )"

          if [ -z "$PBX" ]; then
            echo "::error::project.pbxproj not found."
            exit 1
          fi

          python3 \
            - "$PBX" \
            <<'PY'
          import pathlib
          import re
          import sys

          p = pathlib.Path(
              sys.argv[1]
          )

          s = p.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          s = re.sub(
              r'IPHONEOS_DEPLOYMENT_TARGET = [^;]+;',
              'IPHONEOS_DEPLOYMENT_TARGET = 12.0;',
              s
          )

          s = re.sub(
              r'ENABLE_BITCODE = [^;]+;',
              'ENABLE_BITCODE = NO;',
              s
          )

          s = re.sub(
              r'CODE_SIGN_STYLE = [^;]+;',
              'CODE_SIGN_STYLE = Manual;',
              s
          )

          s = s.replace(
              '-mno-thumb',
              ''
          )

          p.write_text(
              s,
              encoding="utf-8"
          )
          PY

          if grep -RIn \
            -- '-mno-thumb' \
            xcode
          then
            echo \
              "::error::-mno-thumb returned after PBX patch."
            exit 1
          fi

          echo \
            "Xcode legacy ARM flag repair: CLEAN"

      - name: Build unsigned app
        shell: bash
        run: |
          set +e

          mkdir -p \
            "$GITHUB_WORKSPACE/xcode-output"

          WORKSPACE="$(
            find xcode \
              -type d \
              -name '*.xcworkspace' \
              -print \
              | head -1
          )"

          PROJECT="$(
            find xcode \
              -type d \
              -name '*.xcodeproj' \
              -print \
              | head -1
          )"

          echo \
            "===== FINAL LEGACY FLAG CHECK ====="

          if grep -RIn \
            -- '-mno-thumb' \
            xcode
          then
            echo \
              "::error::Legacy -mno-thumb flag exists."
            exit 1
          fi

          COMMON=(
            -scheme Unity-iPhone
            -configuration Release
            -sdk iphoneos
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData"

            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=
            DEVELOPMENT_TEAM=
            ENABLE_BITCODE=NO
            IPHONEOS_DEPLOYMENT_TARGET=12.0
          )

          if [ -n "${WORKSPACE:-}" ]; then

            echo \
              "Building workspace: $WORKSPACE"

            xcodebuild \
              -workspace "$WORKSPACE" \
              "${COMMON[@]}" \
              build \
              2>&1 \
              | tee \
                "$GITHUB_WORKSPACE/xcode-output/xcodebuild.log"

            RC=${PIPESTATUS[0]}

          elif [ -n "${PROJECT:-}" ]; then

            echo \
              "Building project: $PROJECT"

            xcodebuild \
              -project "$PROJECT" \
              "${COMMON[@]}" \
              build \
              2>&1 \
              | tee \
                "$GITHUB_WORKSPACE/xcode-output/xcodebuild.log"

            RC=${PIPESTATUS[0]}

          else

            echo \
              "::error::No Xcode workspace/project found."

            RC=1
          fi

          echo \
            "XCODEBUILD_EXIT_CODE=$RC" \
            | tee \
              "$GITHUB_WORKSPACE/xcode-output/xcode-exit-code.txt"

          echo \
            "===== XCODE ERRORS ====="

          grep -nEi \
            -A 12 \
            -B 6 \
            'error:|fatal error:|BUILD FAILED|undefined symbols|linker command failed|unsupported option' \
            "$GITHUB_WORKSPACE/xcode-output/xcodebuild.log" \
            | tail -1200 \
            || true

          exit "$RC"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            find "$GITHUB_WORKSPACE/DerivedData" \
              -type d \
              -path \
                '*Build/Products/Release-iphoneos/*.app' \
              -print \
              | head -1
          )"

          if [ -z "$APP" ]; then

            echo \
              "::error::Built .app was not found."

            find \
              "$GITHUB_WORKSPACE/DerivedData" \
              -maxdepth 8 \
              -type d \
              -name '*.app' \
              -print

            exit 1
          fi

          echo \
            "Built app: $APP"

          du -sh \
            "$APP"

          rm -rf \
            Payload

          mkdir -p \
            Payload

          cp -R \
            "$APP" \
            Payload/

          zip -qry \
            "$GITHUB_WORKSPACE/NFS-MW-VPREBORN-iOS-v3.7-unsigned.ipa" \
            Payload

          ls -lh \
            "$GITHUB_WORKSPACE/NFS-MW-VPREBORN-iOS-v3.7-unsigned.ipa"

      - name: Collect Xcode diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          DIAG="$GITHUB_WORKSPACE/NFS-MW-v3.7-Xcode-Diagnostics"

          rm -rf "$DIAG"
          mkdir -p "$DIAG"

          cp \
            "$GITHUB_WORKSPACE/xcode-output/xcodebuild.log" \
            "$DIAG/" \
            2>/dev/null || true

          cp \
            "$GITHUB_WORKSPACE/xcode-output/xcode-exit-code.txt" \
            "$DIAG/" \
            2>/dev/null || true

          grep -RIn \
            -- '-mno-thumb' \
            xcode \
            > "$DIAG/mno-thumb-leftovers.txt" \
            2>&1 || true

          xcodebuild \
            -version \
            > "$DIAG/xcode-version.txt" \
            2>&1 || true

          sw_vers \
            > "$DIAG/macos-version.txt" \
            2>&1 || true

          zip -qr \
            "$GITHUB_WORKSPACE/NFS-MW-VPREBORN-iOS-v3.7-Xcode-Diagnostics.zip" \
            "$DIAG"

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NFS-MW-VPREBORN-iOS-v3.7-unsigned-IPA
          path: NFS-MW-VPREBORN-iOS-v3.7-unsigned.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NFS-MW-VPREBORN-iOS-v3.7-Xcode-Diagnostics
          path: NFS-MW-VPREBORN-iOS-v3.7-Xcode-Diagnostics.zip
          if-no-files-found: warn
          compression-level: 0
