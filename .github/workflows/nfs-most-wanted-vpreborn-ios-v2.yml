            <<'CS'
          using System;
          using System.IO;

          using UnityEngine;
          using UnityEngine.SceneManagement;

          public sealed class NFSMWRuntimeLogger :
              MonoBehaviour
          {
              private string logPath;

              [RuntimeInitializeOnLoadMethod(
                  RuntimeInitializeLoadType.BeforeSceneLoad
              )]
              private static void Install()
              {
                  if (
                      FindObjectOfType<
                          NFSMWRuntimeLogger
                      >() != null
                  )
                      return;

                  var go =
                      new GameObject(
                          "NFSMW-iOS-Stability"
                      );

                  DontDestroyOnLoad(go);

                  go.AddComponent<
                      NFSMWRuntimeLogger
                  >();
              }

              private void Awake()
              {
                  logPath =
                      System.IO.Path.Combine(
                          Application.persistentDataPath,
                          "nfs-mw-ios-runtime.log"
                      );

                  Screen.sleepTimeout =
                      SleepTimeout.NeverSleep;

                  Input.multiTouchEnabled =
                      true;

                  QualitySettings.vSyncCount =
                      0;

                  Application.targetFrameRate =
                      60;

                  Application.logMessageReceived +=
                      OnLog;

                  Application.lowMemory +=
                      OnLowMemory;

                  SceneManager.sceneLoaded +=
                      OnSceneLoaded;
              }

              private void OnDestroy()
              {
                  Application.logMessageReceived -=
                      OnLog;

                  Application.lowMemory -=
                      OnLowMemory;

                  SceneManager.sceneLoaded -=
                      OnSceneLoaded;
              }

              private void OnLowMemory()
              {
                  Write(
                      "LOW_MEMORY"
                  );

                  Resources.UnloadUnusedAssets();
              }

              private void OnSceneLoaded(
                  Scene scene,
                  LoadSceneMode mode
              )
              {
                  Write(
                      "SCENE_LOADED " +
                      scene.name
                  );
              }

              private void OnLog(
                  string condition,
                  string stackTrace,
                  LogType type
              )
              {
                  if (type == LogType.Log)
                      return;

                  Write(
                      "[" +
                      type +
                      "] " +
                      condition +
                      "\n" +
                      stackTrace
                  );
              }

              private void Write(
                  string message
              )
              {
                  try
                  {
                      File.AppendAllText(
                          logPath,
                          "[" +
                          DateTime.UtcNow.ToString("O") +
                          "] " +
                          message +
                          "\n"
                      );
                  }
                  catch
                  {
                  }
              }
          }
          CS

          cat > \
            "$PROJECT/Assets/NFSMWiOS/Editor/NFSMWiOSBuild.cs" \
            <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;

          using UnityEditor;
          using UnityEditor.Build.Reporting;

          using UnityEngine;
          using UnityEngine.Rendering;

          public static class NFSMWiOSBuild
          {
              public static void PerformBuild()
              {
                  string output =
                      Environment.GetEnvironmentVariable(
                          "NFS_IOS_XCODE_PATH"
                      );

                  if (
                      String.IsNullOrEmpty(
                          output
                      )
                  )
                  {
                      throw new Exception(
                          "NFS_IOS_XCODE_PATH is missing."
                      );
                  }

                  Directory.CreateDirectory(
                      output
                  );

                  EditorUserBuildSettings
                      .SwitchActiveBuildTarget(
                          BuildTargetGroup.iOS,
                          BuildTarget.iOS
                      );

                  PlayerSettings.companyName =
                      "VPREBORN iOS Port";

                  PlayerSettings.productName =
                      "NFS Most Wanted VPREBORN";

                  PlayerSettings.bundleVersion =
                      "1.0";

                  PlayerSettings
                      .SetApplicationIdentifier(
                          BuildTargetGroup.iOS,
                          "com.negel.nfsmw.vpreborn"
                      );

                  PlayerSettings
                      .SetScriptingBackend(
                          BuildTargetGroup.iOS,
                          ScriptingImplementation.IL2CPP
                      );

                  PlayerSettings
                      .SetApiCompatibilityLevel(
                          BuildTargetGroup.iOS,
                          ApiCompatibilityLevel.NET_4_6
                      );

                  PlayerSettings
                      .iOS
                      .targetOSVersionString =
                      "12.0";

                  PlayerSettings
                      .iOS
                      .sdkVersion =
                      iOSSdkVersion.DeviceSDK;

                  PlayerSettings
                      .iOS
                      .appleEnableAutomaticSigning =
                      false;

                  PlayerSettings.stripEngineCode =
                      false;

                  PlayerSettings
                      .SetManagedStrippingLevel(
                          BuildTargetGroup.iOS,
                          ManagedStrippingLevel.Disabled
                      );

                  PlayerSettings.colorSpace =
                      ColorSpace.Gamma;

                  PlayerSettings
                      .defaultInterfaceOrientation =
                      UIOrientation.LandscapeLeft;

                  PlayerSettings
                      .SetUseDefaultGraphicsAPIs(
                          BuildTarget.iOS,
                          false
                      );

                  PlayerSettings
                      .SetGraphicsAPIs(
                          BuildTarget.iOS,
                          new[]
                          {
                              GraphicsDeviceType.Metal
                          }
                      );

                  ApplyOriginalIcon();

                  string[] allScenes =
                      AssetDatabase
                          .FindAssets(
                              "t:Scene"
                          )
                          .Select(
                              AssetDatabase
                                  .GUIDToAssetPath
                          )
                          .Where(
                              p =>
                                  p.EndsWith(
                                      ".unity",
                                      StringComparison
                                          .OrdinalIgnoreCase
                                  )
                          )
                          .Distinct()
                          .ToArray();

                  if (
                      allScenes.Length ==
                      0
                  )
                  {
                      throw new Exception(
                          "No recovered Unity scenes were found."
                      );
                  }

                  string[] preferred =
                  {
                      "menuloadMW",
                      "GaragMW",
                      "MW"
                  };

                  var ordered =
                      new List<string>();

                  foreach (
                      string wanted
                      in preferred
                  )
                  {
                      string match =
                          allScenes
                              .FirstOrDefault(
                                  p =>
                                      System.IO.Path
                                          .GetFileNameWithoutExtension(
                                              p
                                          )
                                          .Equals(
                                              wanted,
                                              StringComparison
                                                  .OrdinalIgnoreCase
                                          )
                              );

                      if (
                          !String.IsNullOrEmpty(
                              match
                          ) &&
                          !ordered.Contains(
                              match
                          )
                      )
                      {
                          ordered.Add(
                              match
                          );
                      }
                  }

                  foreach (
                      string scene
                      in allScenes.OrderBy(
                          x => x
                      )
                  )
                  {
                      if (
                          !ordered.Contains(
                              scene
                          )
                      )
                      {
                          ordered.Add(
                              scene
                          );
                      }
                  }

                  Debug.Log(
                      "===== NFS MW BUILD SCENES ====="
                  );

                  foreach (
                      string scene
                      in ordered
                  )
                  {
                      Debug.Log(
                          scene
                      );
                  }

                  var options =
                      new BuildPlayerOptions
                      {
                          scenes =
                              ordered.ToArray(),

                          locationPathName =
                              output,

                          target =
                              BuildTarget.iOS,

                          options =
                              BuildOptions.None
                      };

                  BuildReport report =
                      BuildPipeline.BuildPlayer(
                          options
                      );

                  BuildSummary summary =
                      report.summary;

                  Debug.Log(
                      "NFS MW iOS build result: " +
                      summary.result +
                      " errors=" +
                      summary.totalErrors +
                      " warnings=" +
                      summary.totalWarnings
                  );

                  if (
                      summary.result !=
                      BuildResult.Succeeded
                  )
                  {
                      throw new Exception(
                          "iOS Xcode export failed: " +
                          summary.result
                      );
                  }
              }

              private static void ApplyOriginalIcon()
              {
                  const string iconPath =
                      "Assets/NFSMWiOS/app_icon.png";

                  AssetDatabase.ImportAsset(
                      iconPath,
                      ImportAssetOptions
                          .ForceSynchronousImport |
                      ImportAssetOptions
                          .ForceUpdate
                  );

                  var importer =
                      AssetImporter.GetAtPath(
                          iconPath
                      ) as TextureImporter;

                  if (importer != null)
                  {
                      importer.textureType =
                          TextureImporterType.Default;

                      importer.alphaIsTransparency =
                          true;

                      importer.mipmapEnabled =
                          false;

                      importer.textureCompression =
                          TextureImporterCompression
                              .Uncompressed;

                      importer.SaveAndReimport();
                  }

                  Texture2D icon =
                      AssetDatabase.LoadAssetAtPath<
                          Texture2D
                      >(
                          iconPath
                      );

                  if (icon == null)
                      return;

                  int[] sizes =
                      PlayerSettings
                          .GetIconSizesForTargetGroup(
                              BuildTargetGroup.iOS
                          );

                  Texture2D[] icons =
                      new Texture2D[
                          sizes.Length
                      ];

                  for (
                      int i = 0;
                      i < icons.Length;
                      i++
                  )
                  {
                      icons[i] =
                          icon;
                  }

                  PlayerSettings
                      .SetIconsForTargetGroup(
                          BuildTargetGroup.iOS,
                          icons
                      );
              }
          }
          CS

