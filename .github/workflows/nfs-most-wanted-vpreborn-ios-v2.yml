            2>&1 \
            | tee "$OUTPUT/unity-2019-install.log"

          UNITY2019="$(
            find "$INSTALL_ROOT" \
              -type f \
              -path '*/Editor/Unity' \
              -perm -111 \
              -print \
              | grep '2019.4.40f1' \
              | head -1
          )"

          if [ -z "${UNITY2019:-}" ]; then
            UNITY2019="$(
              find "$INSTALL_ROOT" \
                -type f \
                -path '*/Editor/Unity' \
                -perm -111 \
                -print \
                | head -1
            )"
          fi

          if [ -z "$UNITY2019" ]; then
            echo "::error::Unity 2019 Editor executable not found."
            exit 1
          fi

          echo "UNITY2019=$UNITY2019" \
            >> "$GITHUB_ENV"

          "$UNITY2019" -version || true

          UNITY2019_DIR="$(
            dirname "$(dirname "$UNITY2019")"
          )"

          {
            echo "UNITY2019=$UNITY2019"
            echo "UNITY2019_DIR=$UNITY2019_DIR"
            echo
            echo "iOSSupport paths:"

            find "$UNITY2019_DIR" \
              -maxdepth 10 \
              -path '*iOSSupport*' \
              -print \
              2>/dev/null \
              | sed -n '1,300p' \
              || true

          } | tee "$OUTPUT/unity-2019-ios-module-audit.txt"

      - name: Verify Unity 2019 runtime dependencies
        shell: bash
        run: |
          set -euo pipefail

          MISSING="$(
            ldd "$UNITY2019" 2>/dev/null \
              | grep 'not found' \
              || true
          )"

          if [ -n "$MISSING" ]; then
            echo "::error::Unity 2019 is missing Linux shared libraries:"
            echo "$MISSING"
            exit 1
          fi

          echo "Unity 2019 direct shared-library check passed."

      - name: Unity 2019 warm-up import and post-migration UnityScript repair
        shell: bash
        run: |
          set +e

          PROJECT="${{ steps.recover.outputs.project }}"
          WARMUP_LOG="$OUTPUT/unity-2019-warmup.log"

          rm -rf \
            "$PROJECT/Library" \
            "$PROJECT/Temp" \
            "$PROJECT/obj" \
            2>/dev/null || true

          echo "===== UNITY 2019 WARM-UP IMPORT ====="

          timeout 75m xvfb-run -a "$UNITY2019" \
            -batchmode \
            -nographics \
            -quit \
            -accept-apiupdate \
            -projectPath "$PROJECT" \
            -buildTarget iOS \
            -logFile "$WARMUP_LOG"

          WARMUP_RC=$?

          echo "UNITY2019_WARMUP_EXIT_CODE=$WARMUP_RC" \
            | tee "$OUTPUT/unity-2019-warmup-exit-code.txt"

          echo "===== WARM-UP LOG TAIL ====="

          tail -300 "$WARMUP_LOG" || true

          set -e

          echo "===== POST-MIGRATION UNITYSCRIPT REPAIR ====="

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT"])
          assets = project / "Assets"
          output = Path(os.environ["OUTPUT"])

          using_rx = re.compile(
              r'(?m)^[\ufeff \t]*using[ \t]+UnityScript'
              r'(?:\.[A-Za-z_][A-Za-z0-9_.]*)?'
              r'[ \t]*;[ \t]*(?:\r?\n|$)'
          )

          changed = []
          removed_total = 0

          for p in assets.rglob("*.cs"):
              try:
                  s = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  s = p.read_text(encoding="latin1")

              fixed, count = using_rx.subn("", s)

              if count:
                  p.write_text(
                      fixed,
                      encoding="utf-8"
                  )

                  changed.append(
                      (
                          str(p.relative_to(project)),
                          count
                      )
                  )

                  removed_total += count

                  print(
                      "repaired",
                      p.relative_to(project),
                      "removed=",
                      count
                  )

          report = (
              output /
              "post2019-unityscript-repair.txt"
          )

          report.write_text(
              "removed_total=" +
              str(removed_total) +
              "\n" +
              "\n".join(
                  f"{path}: {count}"
                  for path, count in changed
              ) +
              ("\n" if changed else ""),
              encoding="utf-8"
          )

          target = (
              assets /
              "Scripts" /
              "Assembly-UnityScript" /
              "SimpleMeshCombine.cs"
          )

          if target.exists():
              print(
                  "===== SimpleMeshCombine.cs AFTER REPAIR ====="
              )

              for i, line in enumerate(
                  target.read_text(
                      encoding="utf-8",
                      errors="replace"
                  ).splitlines()[:30],
                  1
              ):
                  print(
                      f"{i:03d}: {line}"
                  )

          leftovers = []

          for p in assets.rglob("*.cs"):
              text = p.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              if using_rx.search(text):
                  leftovers.append(
                      str(p.relative_to(project))
                  )

          if leftovers:
              print(
                  "ERROR: UnityScript using directives remain:"
              )

              for x in leftovers:
                  print("  ", x)

              raise SystemExit(1)

          print(
              "POST-MIGRATION UNITYSCRIPT REPAIR: CLEAN"
          )
          PY

          echo "===== REMAINING UNITYSCRIPT REFERENCES ====="

          grep -RIn \
            --include='*.cs' \
            'UnityScript' \
            "$PROJECT/Assets" \
            | tee "$OUTPUT/post2019-unityscript-references.txt" \
            || true

          rm -rf \
            "$PROJECT/Library/ScriptAssemblies" \
            "$PROJECT/Temp" \
            "$PROJECT/obj" \
            2>/dev/null || true

      - name: Build NFS Most Wanted iOS Xcode project
        id: unity_build
        shell: bash
        env:
          NFS_IOS_XCODE_PATH: ${{ github.workspace }}/nfs-build/iOS/NFSMW-VPREBORN-iOS
        run: |
          set +e

          PROJECT="${{ steps.recover.outputs.project }}"
          LOG="$OUTPUT/unity-2019-ios-build.log"

          rm -rf \
            "$PROJECT/Library/ScriptAssemblies" \
            "$PROJECT/Temp" \
            "$PROJECT/obj" \
            2>/dev/null || true

          echo "===== NFS MOST WANTED VPREBORN iOS v3.3 ====="
          echo "Source editor: $SOURCE_UNITY"
          echo "Migration editor: $MIGRATION_UNITY"
          echo "Build editor: $BUILD_UNITY"
          echo "Project: $PROJECT"
          echo "Xcode output: $NFS_IOS_XCODE_PATH"

          echo "===== FINAL UNITYSCRIPT USING-DIRECTIVE CHECK ====="

          if grep -RIn \
            --include='*.cs' \
            -E '^[[:space:]]*using[[:space:]]+UnityScript([.;]|[[:space:]])' \
            "$PROJECT/Assets"
          then
            echo "::error::UnityScript using directive came back before final build."
            exit 1
          fi

          echo "UnityScript using-directive check: CLEAN"

          timeout 100m xvfb-run -a "$UNITY2019" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$PROJECT" \
            -buildTarget iOS \
            -executeMethod NFSMWiOSBuild.PerformBuild \
            -logFile "$LOG"

          RC=$?

          echo "UNITY2019_EXIT_CODE=$RC" \
            | tee "$OUTPUT/unity-2019-exit-code.txt"

          echo "===== UNITY 2019 LOG TAIL ====="

          tail -500 "$LOG" || true

          echo "===== ALL IMPORTANT UNITY ERRORS ====="

          grep -nEi \
            -A 30 \
            -B 10 \
            'error CS[0-9]+|Compilation failed|compiler error|Scripts have compiler errors|Exception|Error building Player|BuildFailedException|DllNotFoundException|TypeLoadException|MissingReferenceException|Fatal error|Native extension for iOS target not found|failed' \
            "$LOG" \
            | tail -1400 \
            | tee "$OUTPUT/unity-2019-important-errors.txt" \
            || true

          exit "$RC"

      - name: Detect Xcode project
        id: detect_xcode
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          READY=false

          if [ -d "$XCODE_OUT" ] && \
             find "$XCODE_OUT" \
               -maxdepth 3 \
               \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) \
               | grep -q .
          then
            READY=true
          fi

          echo "ready=$READY" \
            >> "$GITHUB_OUTPUT"

          {
            echo "XCODE_READY=$READY"
            echo

            if [ -d "$XCODE_OUT" ]; then
              find "$XCODE_OUT" \
                -maxdepth 3 \
                \( -name '*.xcodeproj' -o -name '*.xcworkspace' -o -name 'Info.plist' \) \
                -print
            fi
          } | tee "$OUTPUT/xcode-detection.txt"

      - name: Pack Xcode project
        if: steps.detect_xcode.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          tar \
            -C "$(dirname "$XCODE_OUT")" \
            -czf "$GITHUB_WORKSPACE/NFS-MW-VPREBORN-iOS-v3.3-Xcode.tar.gz" \
            "$(basename "$XCODE_OUT")"

          ls -lh \
            "$GITHUB_WORKSPACE/NFS-MW-VPREBORN-iOS-v3.3-Xcode.tar.gz"

      - name: Collect Unity diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          DIAG="$GITHUB_WORKSPACE/NFS-MW-v3.3-Diagnostics"

          rm -rf "$DIAG"
          mkdir -p "$DIAG"

          cp "$OUTPUT/apk-sha256.txt" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/apk-summary.txt" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/original-icon-sha256.txt" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/NFS-MW-VPREBORN-original-icon.png" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/assetripper.log" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/recovery-summary.txt" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/removed-android-files.txt" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/removed-assemblyinfo.txt" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/pre2017-source-repair.txt" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/pre2017-known-blockers.txt" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/unity-2017-migration-pass1.log" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/unity-2017-migration-pass2.log" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/unity-2017-pass1-exit-code.txt" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/unity-2017-pass2-exit-code.txt" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/unity-2017-pass1-errors.txt" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/unity-2017-pass2-errors.txt" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/unity-2017-migration.log" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/source-patches.txt" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/packages-manifest.json" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/unity-2019-install.log" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/unity-2019-ios-module-audit.txt" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/unity-2019-warmup.log" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/unity-2019-warmup-exit-code.txt" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/post2019-unityscript-repair.txt" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/post2019-unityscript-references.txt" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/unity-2019-ios-build.log" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/unity-2019-exit-code.txt" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/unity-2019-important-errors.txt" "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/xcode-detection.txt" "$DIAG/" 2>/dev/null || true

          {
            echo "===== ENV ====="
            echo "SOURCE_UNITY=$SOURCE_UNITY"
            echo "MIGRATION_UNITY=$MIGRATION_UNITY"
            echo "BUILD_UNITY=$BUILD_UNITY"
            echo

            echo "===== DISK ====="
            df -h
            echo

            echo "===== PROJECT SUMMARY ====="

            if [ -n "${PROJECT:-}" ] && [ -d "${PROJECT:-}" ]; then
              find "$PROJECT/Assets" \
                -type f \
                -name '*.unity' \
                | sort
            fi
          } > "$DIAG/environment.txt" 2>&1 || true

          zip -qr \
            "$GITHUB_WORKSPACE/NFS-MW-VPREBORN-iOS-v3.3-Diagnostics.zip" \
            "$DIAG"

      - name: Upload NFS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NFS-MW-VPREBORN-iOS-v3.3-Diagnostics
          path: NFS-MW-VPREBORN-iOS-v3.3-Diagnostics.zip
          if-no-files-found: warn
          compression-level: 0

      - name: Upload Xcode project
        if: steps.detect_xcode.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NFS-MW-VPREBORN-iOS-v3.3-Xcode
          path: NFS-MW-VPREBORN-iOS-v3.3-Xcode.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: Fail clearly if Unity did not export Xcode
        if: steps.detect_xcode.outputs.ready != 'true'
        shell: bash
        run: |
          echo "::error::Unity did not generate the iOS Xcode project. Check NFS-MW-VPREBORN-iOS-v3.3-Diagnostics."
          exit 1

  xcode_build:
    name: 2. Build unsigned IPA on macOS
    needs: recover_and_export
    if: needs.recover_and_export.outputs.xcode_ready == 'true'
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Download Xcode project
        uses: actions/download-artifact@v4
        with:
          name: NFS-MW-VPREBORN-iOS-v3.3-Xcode
          path: xcode-artifact

      - name: Extract Xcode project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p xcode

          tar \
            -xzf xcode-artifact/NFS-MW-VPREBORN-iOS-v3.3-Xcode.tar.gz \
            -C xcode

          find xcode \
            -maxdepth 4 \
            \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) \
            -print

      - name: Patch project for modern Xcode and unsigned build
        shell: bash
        run: |
          set -euo pipefail

          PBX="$(
            find xcode \
              -type f \
              -path '*/project.pbxproj' \
              -print \
              | head -1
          )"

          if [ -z "$PBX" ]; then
            echo "::error::project.pbxproj not found."
            exit 1
          fi

          python3 - "$PBX" <<'PY'
          import pathlib
          import re
          import sys

          p = pathlib.Path(sys.argv[1])

          s = p.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          s = re.sub(
              r'IPHONEOS_DEPLOYMENT_TARGET = [^;]+;',
              'IPHONEOS_DEPLOYMENT_TARGET = 12.0;',
              s
          )

          s = re.sub(
              r'ENABLE_BITCODE = [^;]+;',
              'ENABLE_BITCODE = NO;',
              s
          )

          s = re.sub(
              r'CODE_SIGN_STYLE = [^;]+;',
              'CODE_SIGN_STYLE = Manual;',
              s
          )

          p.write_text(
              s,
              encoding="utf-8"
          )
          PY

      - name: Build unsigned app
        shell: bash
        run: |
          set +e

          mkdir -p \
            "$GITHUB_WORKSPACE/xcode-output"

          WORKSPACE="$(
            find xcode \
              -type d \
              -name '*.xcworkspace' \
              -print \
              | head -1
          )"

          PROJECT="$(
            find xcode \
              -type d \
              -name '*.xcodeproj' \
              -print \
              | head -1
          )"

          COMMON=(
            -scheme Unity-iPhone
            -configuration Release
            -sdk iphoneos
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=
            DEVELOPMENT_TEAM=
            ENABLE_BITCODE=NO
            IPHONEOS_DEPLOYMENT_TARGET=12.0
          )

          if [ -n "${WORKSPACE:-}" ]; then
            echo "Building workspace: $WORKSPACE"

            xcodebuild \
              -workspace "$WORKSPACE" \
              "${COMMON[@]}" \
              build \
              2>&1 \
              | tee "$GITHUB_WORKSPACE/xcode-output/xcodebuild.log"

            RC=${PIPESTATUS[0]}

          elif [ -n "${PROJECT:-}" ]; then
            echo "Building project: $PROJECT"

            xcodebuild \
              -project "$PROJECT" \
              "${COMMON[@]}" \
              build \
              2>&1 \
              | tee "$GITHUB_WORKSPACE/xcode-output/xcodebuild.log"

            RC=${PIPESTATUS[0]}

          else
            echo "::error::No Xcode workspace/project found."
            RC=1
          fi

          echo "XCODEBUILD_EXIT_CODE=$RC" \
            | tee "$GITHUB_WORKSPACE/xcode-output/xcode-exit-code.txt"

          tail -500 \
            "$GITHUB_WORKSPACE/xcode-output/xcodebuild.log" \
            || true

          exit "$RC"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            find "$GITHUB_WORKSPACE/DerivedData" \
              -type d \
              -path '*Build/Products/Release-iphoneos/*.app' \
              -print \
              | head -1
          )"

          if [ -z "$APP" ]; then
            echo "::error::Built .app was not found."

            find "$GITHUB_WORKSPACE/DerivedData" \
              -maxdepth 8 \
              -type d \
              -name '*.app' \
              -print

            exit 1
          fi

          rm -rf Payload

          mkdir -p Payload

          cp -R \
            "$APP" \
            Payload/

          zip -qry \
            "$GITHUB_WORKSPACE/NFS-MW-VPREBORN-iOS-v3.3-unsigned.ipa" \
            Payload

          ls -lh \
            "$GITHUB_WORKSPACE/NFS-MW-VPREBORN-iOS-v3.3-unsigned.ipa"

      - name: Collect Xcode diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          DIAG="$GITHUB_WORKSPACE/NFS-MW-v3.3-Xcode-Diagnostics"

          rm -rf "$DIAG"

          mkdir -p "$DIAG"

          cp \
            "$GITHUB_WORKSPACE/xcode-output/xcodebuild.log" \
            "$DIAG/" \
            2>/dev/null || true

          cp \
            "$GITHUB_WORKSPACE/xcode-output/xcode-exit-code.txt" \
            "$DIAG/" \
            2>/dev/null || true

          xcodebuild -version \
            > "$DIAG/xcode-version.txt" \
            2>&1 || true

          sw_vers \
            > "$DIAG/macos-version.txt" \
            2>&1 || true

          zip -qr \
            "$GITHUB_WORKSPACE/NFS-MW-VPREBORN-iOS-v3.3-Xcode-Diagnostics.zip" \
            "$DIAG"

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NFS-MW-VPREBORN-iOS-v3.3-unsigned-IPA
          path: NFS-MW-VPREBORN-iOS-v3.3-unsigned.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Upload Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NFS-MW-VPREBORN-iOS-v3.3-Xcode-Diagnostics
          path: NFS-MW-VPREBORN-iOS-v3.3-Xcode-Diagnostics.zip
          if-no-files-found: warn
          compression-level: 0
