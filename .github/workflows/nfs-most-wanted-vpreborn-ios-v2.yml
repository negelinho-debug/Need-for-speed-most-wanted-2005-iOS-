      - name: Install v3.7 graphics and collision repair
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.recover.outputs.project }}"

          mkdir -p \
            "$PROJECT/Assets/NFSMWiOS/Editor"

          cat > \
            "$PROJECT/Assets/NFSMWiOS/Editor/NFSMWGraphicsRepair.cs" \
            <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;

          using UnityEditor;
          using UnityEditor.SceneManagement;

          using UnityEngine;
          using UnityEngine.SceneManagement;
          using UnityEngine.Rendering;

          public static class NFSMWGraphicsRepair
          {
              private static int materialsScanned;
              private static int materialsRepaired;
              private static int materialsWithoutTexture;
              private static int meshCollidersAdded;
              private static int terrainCollidersAdded;
              private static int collidersEnabled;

              private sealed class TextureChoice
              {
                  public Texture texture;
                  public string property;
                  public Vector2 scale;
                  public Vector2 offset;
              }

              public static void Run()
              {
                  Debug.Log(
                      "===== NFS MW v3.7 GRAPHICS/COLLISION REPAIR START ====="
                  );

                  RepairMaterials();
                  RepairScenes();

                  AssetDatabase.SaveAssets();
                  AssetDatabase.Refresh();

                  string report =
                      "materialsScanned=" +
                      materialsScanned +
                      "\nmaterialsRepaired=" +
                      materialsRepaired +
                      "\nmaterialsWithoutTexture=" +
                      materialsWithoutTexture +
                      "\nmeshCollidersAdded=" +
                      meshCollidersAdded +
                      "\nterrainCollidersAdded=" +
                      terrainCollidersAdded +
                      "\ncollidersEnabled=" +
                      collidersEnabled +
                      "\n";

                  string reportPath =
                      Environment.GetEnvironmentVariable(
                          "NFS_REPAIR_REPORT_PATH"
                      );

                  if (
                      !String.IsNullOrEmpty(
                          reportPath
                      )
                  )
                  {
                      try
                      {
                          System.IO.File.WriteAllText(
                              reportPath,
                              report
                          );
                      }
                      catch (
                          Exception ex
                      )
                      {
                          Debug.LogWarning(
                              "Could not write repair report: " +
                              ex.Message
                          );
                      }
                  }

                  Debug.Log(
                      "===== NFS MW v3.7 REPAIR RESULT =====\n" +
                      report
                  );
              }

              private static void RepairMaterials()
              {
                  string[] materialGuids =
                      AssetDatabase.FindAssets(
                          "t:Material"
                      );

                  foreach (
                      string guid
                      in materialGuids
                  )
                  {
                      string path =
                          AssetDatabase.GUIDToAssetPath(
                              guid
                          );

                      Material material =
                          AssetDatabase.LoadAssetAtPath<
                              Material
                          >(
                              path
                          );

                      if (material == null)
                          continue;

                      materialsScanned++;

                      Shader oldShader =
                          material.shader;

                      bool broken =
                          oldShader == null;

                      bool internalError =
                          oldShader != null &&
                          oldShader.name ==
                          "Hidden/InternalErrorShader";

                      bool dummy =
                          IsAssetRipperDummyShader(
                              oldShader
                          );

                      if (
                          !broken &&
                          !internalError &&
                          !dummy
                      )
                      {
                          continue;
                      }

                      string oldShaderName =
                          oldShader != null
                              ? oldShader.name
                              : "";

                      if (
                          ContainsIgnoreCase(
                              oldShaderName,
                              "Skybox"
                          ) ||
                          ContainsIgnoreCase(
                              material.name,
                              "Skybox"
                          )
                      )
                      {
                          Debug.Log(
                              "Skip skybox material: " +
                              path
                          );

                          continue;
                      }

                      TextureChoice texture =
                          FindBestTexture(
                              material
                          );

                      Color savedColor =
                          Color.white;

                      if (
                          material.HasProperty(
                              "_Color"
                          )
                      )
                      {
                          savedColor =
                              material.GetColor(
                                  "_Color"
                              );
                      }

                      int oldQueue =
                          material.renderQueue;

                      Shader replacement =
                          FindReplacementShader(
                              material,
                              oldShaderName
                          );

                      if (replacement == null)
                      {
                          Debug.LogWarning(
                              "NO REPLACEMENT SHADER: " +
                              path +
                              " old=" +
                              oldShaderName
                          );

                          continue;
                      }

                      material.shader =
                          replacement;

                      if (
                          texture != null &&
                          texture.texture != null &&
                          material.HasProperty(
                              "_MainTex"
                          )
                      )
                      {
                          material.SetTexture(
                              "_MainTex",
                              texture.texture
                          );

                          material.SetTextureScale(
                              "_MainTex",
                              texture.scale
                          );

                          material.SetTextureOffset(
                              "_MainTex",
                              texture.offset
                          );
                      }
                      else
                      {
                          materialsWithoutTexture++;

                          Debug.LogWarning(
                              "Repaired material has no recovered texture: " +
                              path +
                              " oldShader=" +
                              oldShaderName
                          );
                      }

                      if (
                          material.HasProperty(
                              "_Color"
                          )
                      )
                      {
                          material.SetColor(
                              "_Color",
                              savedColor
                          );
                      }

                      ConfigureReplacement(
                          material,
                          replacement,
                          oldShaderName,
                          oldQueue
                      );

                      EditorUtility.SetDirty(
                          material
                      );

                      materialsRepaired++;

                      Debug.Log(
                          "MATERIAL REPAIR: " +
                          path +
                          " | " +
                          oldShaderName +
                          " -> " +
                          replacement.name +
                          " | texture=" +
                          (
                              texture != null &&
                              texture.texture != null
                                  ? texture.texture.name +
                                    " from " +
                                    texture.property
                                  : "NONE"
                          )
                      );
                  }
              }

              private static bool IsAssetRipperDummyShader(
                  Shader shader
              )
              {
                  if (shader == null)
                      return false;

                  string assetPath =
                      AssetDatabase.GetAssetPath(
                          shader
                      );

                  if (
                      String.IsNullOrEmpty(
                          assetPath
                      )
                  )
                  {
                      return false;
                  }

                  string projectRoot =
                      System.IO.Directory
                          .GetParent(
                              Application.dataPath
                          )
                          .FullName;

                  string fullPath =
                      System.IO.Path.Combine(
                          projectRoot,
                          assetPath
                      );

                  if (
                      !System.IO.File.Exists(
                          fullPath
                      )
                  )
                  {
                      return false;
                  }

                  try
                  {
                      string source =
                          System.IO.File.ReadAllText(
                              fullPath
                          );

                      return source.Contains(
                          "DummyShaderTextExporter"
                      );
                  }
                  catch
                  {
                      return false;
                  }
              }

              private static TextureChoice FindBestTexture(
                  Material material
              )
              {
                  string[] preferred =
                  {
                      "_MainTex",
                      "_BaseMap",
                      "_BaseTex",
                      "_Diffuse",
                      "_DiffuseTex",
                      "_Albedo",
                      "_AlbedoTex",
                      "_Texture",
                      "_Tex",
                      "_ColorMap",
                      "_DetailTex"
                  };

                  foreach (
                      string property
                      in preferred
                  )
                  {
                      if (
                          !material.HasProperty(
                              property
                          )
                      )
                      {
                          continue;
                      }

                      Texture texture =
                          material.GetTexture(
                              property
                          );

                      if (texture == null)
                          continue;

                      return new TextureChoice
                      {
                          texture =
                              texture,

                          property =
                              property,

                          scale =
                              material.GetTextureScale(
                                  property
                              ),

                          offset =
                              material.GetTextureOffset(
                                  property
                              )
                      };
                  }

                  try
                  {
                      string[] properties =
                          material
                              .GetTexturePropertyNames();

                      foreach (
                          string property
                          in properties
                      )
                      {
                          Texture texture =
                              material.GetTexture(
                                  property
                              );

                          if (texture == null)
                              continue;

                          return new TextureChoice
                          {
                              texture =
                                  texture,

                              property =
                                  property,

                              scale =
                                  material.GetTextureScale(
                                      property
                                  ),

                              offset =
                                  material.GetTextureOffset(
                                      property
                                  )
                          };
                      }
                  }
                  catch
                  {
                  }

                  return null;
              }

              private static Shader FindReplacementShader(
                  Material material,
                  string oldShaderName
              )
              {
                  string check =
                      (
                          material.name +
                          " " +
                          oldShaderName
                      ).ToLowerInvariant();

                  Shader shader;

                  if (
                      check.Contains(
                          "particle"
                      ) ||
                      check.Contains(
                          "smoke"
                      ) ||
                      check.Contains(
                          "flare"
                      )
                  )
                  {
                      shader =
                          Shader.Find(
                              "Particles/Standard Unlit"
                          );

                      if (shader != null)
                          return shader;

                      shader =
                          Shader.Find(
                              "Particles/Additive"
                          );

                      if (shader != null)
                          return shader;
                  }

                  if (
                      check.Contains(
                          "glass"
                      ) ||
                      check.Contains(
                          "window"
                      ) ||
                      check.Contains(
                          "transparent"
                      )
                  )
                  {
                      shader =
                          Shader.Find(
                              "Legacy Shaders/Transparent/Diffuse"
                          );

                      if (shader != null)
                          return shader;

                      shader =
                          Shader.Find(
                              "Unlit/Transparent"
                          );

                      if (shader != null)
                          return shader;
                  }

                  if (
                      check.Contains(
                          "ui/"
                      ) ||
                      check.Contains(
                          " ui "
                      ) ||
                      check.Contains(
                          "hud"
                      ) ||
                      check.Contains(
                          "button"
                      ) ||
                      check.Contains(
                          "sprite"
                      )
                  )
                  {
                      shader =
                          Shader.Find(
                              "UI/Default"
                          );

                      if (shader != null)
                          return shader;
                  }

                  shader =
                      Shader.Find(
                          "Standard"
                      );

                  if (shader != null)
                      return shader;

                  shader =
                      Shader.Find(
                          "Unlit/Texture"
                      );

                  return shader;
              }

              private static void ConfigureReplacement(
                  Material material,
                  Shader replacement,
                  string oldShaderName,
                  int oldQueue
              )
              {
                  string check =
                      (
                          material.name +
                          " " +
                          oldShaderName
                      ).ToLowerInvariant();

                  bool transparent =
                      check.Contains(
                          "glass"
                      ) ||
                      check.Contains(
                          "window"
                      ) ||
                      check.Contains(
                          "transparent"
                      );

                  if (
                      replacement.name !=
                      "Standard"
                  )
                  {
                      if (oldQueue > 0)
                      {
                          material.renderQueue =
                              oldQueue;
                      }

                      return;
                  }

                  if (!transparent)
                  {
                      material.SetFloat(
                          "_Mode",
                          0f
                      );

                      material.SetInt(
                          "_SrcBlend",
                          (
                              int
                          )
                          BlendMode.One
                      );

                      material.SetInt(
                          "_DstBlend",
                          (
                              int
                          )
                          BlendMode.Zero
                      );

                      material.SetInt(
                          "_ZWrite",
                          1
                      );

                      material.DisableKeyword(
                          "_ALPHATEST_ON"
                      );

                      material.DisableKeyword(
                          "_ALPHABLEND_ON"
                      );

                      material.DisableKeyword(
                          "_ALPHAPREMULTIPLY_ON"
                      );

                      material.renderQueue =
                          -1;

                      return;
                  }

                  material.SetFloat(
                      "_Mode",
                      3f
                  );

                  material.SetInt(
                      "_SrcBlend",
                      (
                          int
                      )
                      BlendMode.One
                  );

                  material.SetInt(
                      "_DstBlend",
                      (
                          int
                      )
                      BlendMode.OneMinusSrcAlpha
                  );

                  material.SetInt(
                      "_ZWrite",
                      0
                  );

                  material.DisableKeyword(
                      "_ALPHATEST_ON"
                  );

                  material.DisableKeyword(
                      "_ALPHABLEND_ON"
                  );

                  material.EnableKeyword(
                      "_ALPHAPREMULTIPLY_ON"
                  );

                  material.renderQueue =
                      3000;
              }

              private static void RepairScenes()
              {
                  string[] scenePaths =
                      AssetDatabase
                          .FindAssets(
                              "t:Scene"
                          )
                          .Select(
                              AssetDatabase
                                  .GUIDToAssetPath
                          )
                          .Where(
                              p =>
                                  p.EndsWith(
                                      ".unity",
                                      StringComparison
                                          .OrdinalIgnoreCase
                                  )
                          )
                          .Distinct()
                          .ToArray();

                  foreach (
                      string scenePath
                      in scenePaths
                  )
                  {
                      Scene scene;

                      try
                      {
                          scene =
                              EditorSceneManager
                                  .OpenScene(
                                      scenePath,
                                      OpenSceneMode.Single
                                  );
                      }
                      catch (
                          Exception ex
                      )
                      {
                          Debug.LogWarning(
                              "Could not open scene " +
                              scenePath +
                              ": " +
                              ex.Message
                          );

                          continue;
                      }

                      bool changed =
                          false;

                      GameObject[] roots =
                          scene
                              .GetRootGameObjects();

                      foreach (
                          GameObject root
                          in roots
                      )
                      {
                          Transform[] objects =
                              root
                                  .GetComponentsInChildren<
                                      Transform
                                  >(
                                      true
                                  );

                          foreach (
                              Transform transform
                              in objects
                          )
                          {
                              GameObject go =
                                  transform.gameObject;

                              Terrain terrain =
                                  go.GetComponent<
                                      Terrain
                                  >();

                              if (
                                  terrain != null &&
                                  terrain.terrainData !=
                                  null
                              )
                              {
                                  TerrainCollider tc =
                                      go.GetComponent<
                                          TerrainCollider
                                      >();

                                  if (tc == null)
                                  {
                                      tc =
                                          go.AddComponent<
                                              TerrainCollider
                                          >();

                                      tc.terrainData =
                                          terrain.terrainData;

                                      terrainCollidersAdded++;

                                      changed =
                                          true;

                                      Debug.Log(
                                          "Added TerrainCollider: " +
                                          HierarchyPath(
                                              transform
                                          )
                                      );
                                  }
                                  else if (
                                      !tc.enabled
                                  )
                                  {
                                      tc.enabled =
                                          true;

                                      collidersEnabled++;

                                      changed =
                                          true;
                                  }
                              }

                              if (
                                  !LooksLikeDriveSurface(
                                      go
                                  )
                              )
                              {
                                  continue;
                              }

                              Rigidbody rb =
                                  go.GetComponentInParent<
                                      Rigidbody
                                  >();

                              if (rb != null)
                                  continue;

                              Collider ownCollider =
                                  go.GetComponent<
                                      Collider
                                  >();

                              if (
                                  ownCollider != null
                              )
                              {
                                  if (
                                      !ownCollider.enabled
                                  )
                                  {
                                      ownCollider.enabled =
                                          true;

                                      collidersEnabled++;

                                      changed =
                                          true;
                                  }

                                  continue;
                              }

                              Collider parentCollider =
                                  go.GetComponentInParent<
                                      Collider
                                  >();

                              if (
                                  parentCollider != null
                              )
                              {
                                  continue;
                              }

                              Collider childCollider =
                                  go.GetComponentInChildren<
                                      Collider
                                  >(
                                      true
                                  );

                              if (
                                  childCollider != null
                              )
                              {
                                  continue;
                              }

                              MeshFilter filter =
                                  go.GetComponent<
                                      MeshFilter
                                  >();

                              MeshRenderer renderer =
                                  go.GetComponent<
                                      MeshRenderer
                                  >();

                              if (
                                  filter == null ||
                                  renderer == null ||
                                  filter.sharedMesh ==
                                  null
                              )
                              {
                                  continue;
                              }

                              MeshCollider mc =
                                  go.AddComponent<
                                      MeshCollider
                                  >();

                              mc.sharedMesh =
                                  filter.sharedMesh;

                              mc.convex =
                                  false;

                              mc.isTrigger =
                                  false;

                              meshCollidersAdded++;

                              changed =
                                  true;

                              Debug.Log(
                                  "Added MeshCollider: " +
                                  HierarchyPath(
                                      transform
                                  )
                              );
                          }
                      }

                      if (changed)
                      {
                          EditorSceneManager
                              .MarkSceneDirty(
                                  scene
                              );

                          EditorSceneManager
                              .SaveScene(
                                  scene
                              );
                      }
                  }
              }

              private static bool LooksLikeDriveSurface(
                  GameObject go
              )
              {
                  string check =
                      go.name
                          .ToLowerInvariant();

                  Renderer renderer =
                      go.GetComponent<
                          Renderer
                      >();

                  if (renderer != null)
                  {
                      Material[] materials =
                          renderer.sharedMaterials;

                      foreach (
                          Material material
                          in materials
                      )
                      {
                          if (material == null)
                              continue;

                          check +=
                              " " +
                              material.name
                                  .ToLowerInvariant();

                          if (
                              material.shader !=
                              null
                          )
                          {
                              check +=
                                  " " +
                                  material.shader.name
                                      .ToLowerInvariant();
                          }
                      }
                  }

                  string[] keywords =
                  {
                      "road",
                      "asphalt",
                      "street",
                      "highway",
                      "ground",
                      "track",
                      "pavement",
                      "terrain"
                  };

                  foreach (
                      string keyword
                      in keywords
                  )
                  {
                      if (
                          check.Contains(
                              keyword
                          )
                      )
                      {
                          return true;
                      }
                  }

                  return false;
              }

              private static string HierarchyPath(
                  Transform transform
              )
              {
                  string value =
                      transform.name;

                  Transform parent =
                      transform.parent;

                  while (
                      parent != null
                  )
                  {
                      value =
                          parent.name +
                          "/" +
                          value;

                      parent =
                          parent.parent;
                  }

                  return value;
              }

              private static bool ContainsIgnoreCase(
                  string value,
                  string text
              )
              {
                  if (
                      String.IsNullOrEmpty(
                          value
                      )
                  )
                  {
                      return false;
                  }

                  return value.IndexOf(
                      text,
                      StringComparison
                          .OrdinalIgnoreCase
                  ) >= 0;
              }
          }
