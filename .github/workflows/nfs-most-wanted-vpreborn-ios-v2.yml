name: NFS Most Wanted VPREBORN iOS - v3.7 Graphics Collision Repair

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover_and_export:
    name: 1. Recover APK, repair graphics, export iOS
    runs-on: ubuntu-22.04
    timeout-minutes: 210

    env:
      UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_EMAIL: ${{ secrets.UNITY_USERNAME }}

      SOURCE_UNITY: "5.6.4p2"
      MIGRATION_UNITY: "2017.4.40f1"
      MIGRATION_CHANGESET: "6e14067f8a9a"

      BUILD_UNITY: "2019.4.40f1"
      BUILD_CHANGESET: "ffc62b691db5"

      WORK: ${{ github.workspace }}/nfs-work
      APK: ${{ github.workspace }}/nfs-work/NFS-Most-Wanted-VPREBORN.apk
      APKROOT: ${{ github.workspace }}/nfs-work/apk
      RECOVERED: ${{ github.workspace }}/nfs-work/recovered
      OUTPUT: ${{ github.workspace }}/nfs-output
      XCODE_OUT: ${{ github.workspace }}/nfs-build/iOS/NFSMW-VPREBORN-iOS

    outputs:
      xcode_ready: ${{ steps.detect_xcode.outputs.ready }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare folders
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$WORK" \
            "$OUTPUT" \
            "$GITHUB_WORKSPACE/nfs-build"

          mkdir -p \
            "$WORK" \
            "$APKROOT" \
            "$RECOVERED" \
            "$OUTPUT" \
            "$GITHUB_WORKSPACE/nfs-build/iOS"

      - name: Install Linux runtime dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update \
            -o Acquire::Retries=4

          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get install -y \
            ca-certificates \
            curl \
            file \
            git \
            gnupg \
            jq \
            libasound2 \
            libgconf-2-4 \
            libglu1-mesa \
            libgtk2.0-0 \
            libgtk-3-0 \
            libnss3 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxfixes3 \
            libxi6 \
            libxinerama1 \
            libxrandr2 \
            libxss1 \
            libxtst6 \
            libdrm2 \
            libgbm1 \
            p7zip-full \
            python3 \
            unzip \
            xz-utils \
            xvfb \
            zip

      - name: Find NFS Most Wanted APK automatically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "===== SEARCH APK IN REPOSITORY ====="

          FOUND="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname '*.apk' \
              ! -path "$WORK/*" \
              -printf '%s %p\n' \
              | sort -nr \
              | head -1 \
              | cut -d' ' -f2-
          )"

          if [ -n "${FOUND:-}" ] && [ -f "$FOUND" ]; then

            if head -c 200 "$FOUND" 2>/dev/null \
              | grep -q 'git-lfs.github.com/spec'
            then
              echo "APK is LFS pointer. Pulling..."
              git lfs install --local || true
              git lfs pull || true
            fi

            if [ -s "$FOUND" ] && \
               ! head -c 200 "$FOUND" 2>/dev/null \
                 | grep -q 'git-lfs.github.com/spec'
            then
              cp "$FOUND" "$APK"
            fi
          fi

          if [ ! -s "$APK" ]; then

            echo "===== SEARCH APK IN RELEASES ====="

            TAGS="$(
              gh release list \
                --repo "$GITHUB_REPOSITORY" \
                --limit 100 \
                --json tagName \
                --jq '.[].tagName' \
                2>/dev/null || true
            )"

            for TAG in $TAGS; do

              rm -rf "$WORK/release-one"
              mkdir -p "$WORK/release-one"

              gh release download "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern '*.apk' \
                --dir "$WORK/release-one" \
                2>/dev/null || true

              CANDIDATE="$(
                find "$WORK/release-one" \
                  -type f \
                  -iname '*.apk' \
                  -printf '%s %p\n' \
                  | sort -nr \
                  | head -1 \
                  | cut -d' ' -f2-
              )"

              if [ -n "${CANDIDATE:-}" ] && \
                 [ -s "$CANDIDATE" ]
              then
                cp "$CANDIDATE" "$APK"
                break
              fi
            done
          fi

          if [ ! -s "$APK" ]; then
            echo "::error::No APK found."
            exit 1
          fi

          echo "APK:"
          ls -lh "$APK"

          sha256sum "$APK" \
            | tee "$OUTPUT/apk-sha256.txt"

      - name: Verify exact VPREBORN base
        shell: bash
        run: |
          set -euo pipefail

          unzip -oq \
            "$APK" \
            -d "$APKROOT"

          DATA="$APKROOT/assets/bin/Data"
          MANAGED="$DATA/Managed"

          test -s "$DATA/globalgamemanagers"
          test -s "$MANAGED/Assembly-CSharp.dll"
          test -s "$MANAGED/Assembly-UnityScript.dll"

          VERSION="$(
            strings "$DATA/globalgamemanagers" \
              | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+[abfp][0-9]+' \
              | head -1
          )"

          echo "Detected Unity: $VERSION"

          if [ "$VERSION" != "$SOURCE_UNITY" ]; then
            echo "::error::Expected Unity $SOURCE_UNITY, got ${VERSION:-unknown}"
            exit 1
          fi

          if find "$APKROOT" \
            -type f \
            -name 'libil2cpp.so' \
            | grep -q .
          then
            echo "::error::Expected Mono VPREBORN APK."
            exit 1
          fi

          if ! find "$APKROOT" \
            -type f \
            -name 'libmono.so' \
            | grep -q .
          then
            echo "::error::libmono.so not found."
            exit 1
          fi

          {
            echo "APK_SIZE=$(stat -c%s "$APK")"
            echo "UNITY_VERSION=$VERSION"
            echo "ASSEMBLY_CSHARP_SIZE=$(stat -c%s "$MANAGED/Assembly-CSharp.dll")"
            echo "ASSEMBLY_UNITYSCRIPT_SIZE=$(stat -c%s "$MANAGED/Assembly-UnityScript.dll")"

            echo
            echo "SCENES:"

            strings "$DATA/globalgamemanagers" \
              | grep -E 'Assets/.+\.unity$' \
              | sort -u || true

          } | tee "$OUTPUT/apk-summary.txt"

      - name: Extract original APK icon
        shell: bash
        run: |
          set -euo pipefail

          ICON="$APKROOT/res/drawable-xxxhdpi-v4/app_icon.png"

          if [ ! -s "$ICON" ]; then

            ICON="$(
              find "$APKROOT/res" \
                -type f \
                -iname 'app_icon.png' \
                -printf '%s %p\n' \
                | sort -nr \
                | head -1 \
                | cut -d' ' -f2-
            )"

          fi

          if [ -z "${ICON:-}" ] || [ ! -s "$ICON" ]; then
            echo "::error::Original app icon not found."
            exit 1
          fi

          cp \
            "$ICON" \
            "$OUTPUT/NFS-MW-VPREBORN-original-icon.png"

      - name: Download AssetRipper 2.0.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p \
            "$WORK/tools/assetripper"

          gh release download 2.0.0 \
            -R AssetRipper/AssetRipper \
            -p 'AssetRipper_linux_x64.tar.xz' \
            -D "$WORK/tools"

          tar -xJf \
            "$WORK/tools/AssetRipper_linux_x64.tar.xz" \
            -C "$WORK/tools/assetripper"

          RIPPER="$(
            find "$WORK/tools/assetripper" \
              -type f \
              \( \
                -name 'AssetRipper.GUI.Free' \
                -o -name 'AssetRipper.GUI' \
                -o -name 'AssetRipper' \
              \) \
              -print \
              | head -1
          )"

          if [ -z "$RIPPER" ]; then
            echo "::error::AssetRipper executable not found."
            exit 1
          fi

          chmod +x "$RIPPER"

          echo "RIPPER=$RIPPER" \
            >> "$GITHUB_ENV"

      - name: Recover editable Unity project
        id: recover
        shell: bash
        run: |
          set -euo pipefail

          PORT=3333
          EXPORT="$RECOVERED/NFSMW-VPREBORN"

          mkdir -p "$EXPORT"

          "$RIPPER" \
            --headless \
            --port "$PORT" \
            > "$OUTPUT/assetripper.log" \
            2>&1 &

          PID=$!

          trap \
            'kill "$PID" 2>/dev/null || true' \
            EXIT

          READY=0

          for i in $(seq 1 120); do

            if curl -fsS \
              "http://127.0.0.1:${PORT}/" \
              >/dev/null \
              2>&1
            then
              READY=1
              break
            fi

            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "::error::AssetRipper did not start."
            tail -300 "$OUTPUT/assetripper.log" || true
            exit 1
          fi

          LOAD_CODE="$(
            curl -sS \
              -o "$OUTPUT/assetripper-load-response.txt" \
              -w '%{http_code}' \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "Path=$APKROOT" \
              "http://127.0.0.1:${PORT}/LoadFolder"
          )"

          echo "LOAD_HTTP=$LOAD_CODE"

          if [ "$LOAD_CODE" != "200" ] && \
             [ "$LOAD_CODE" != "302" ]
          then
            echo "::error::AssetRipper LoadFolder failed."
            exit 1
          fi

          EXPORT_CODE="$(
            curl -sS \
              -o "$OUTPUT/assetripper-export-response.txt" \
              -w '%{http_code}' \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "Path=$EXPORT" \
              --data-urlencode 'CreateSubfolder=false' \
              "http://127.0.0.1:${PORT}/Export/UnityProject"
          )"

          echo "EXPORT_HTTP=$EXPORT_CODE"

          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          trap - EXIT

          if [ "$EXPORT_CODE" != "200" ] && \
             [ "$EXPORT_CODE" != "302" ]
          then
            echo "::error::AssetRipper export failed."
            exit 1
          fi

          PROJECT=""

          if [ -d "$EXPORT/ExportedProject/Assets" ]; then
            PROJECT="$EXPORT/ExportedProject"

          elif [ -d "$EXPORT/Assets" ]; then
            PROJECT="$EXPORT"

          else
            PROJECT="$(
              find "$EXPORT" \
                -type d \
                -name Assets \
                -print \
                | head -1 \
                | xargs -r dirname
            )"
          fi

          if [ -z "$PROJECT" ] || \
             [ ! -d "$PROJECT/Assets" ]
          then
            echo "::error::Recovered Unity project not found."
            exit 1
          fi

          PROJECT="$(realpath "$PROJECT")"

          echo "project=$PROJECT" \
            >> "$GITHUB_OUTPUT"

          echo "PROJECT=$PROJECT" \
            >> "$GITHUB_ENV"

          {
            echo "RECOVERED_PROJECT=$PROJECT"
            echo "SCENES=$(find "$PROJECT/Assets" -type f -name '*.unity' | wc -l | tr -d ' ')"
            echo "CS_FILES=$(find "$PROJECT/Assets" -type f -name '*.cs' | wc -l | tr -d ' ')"
            echo "MATERIALS=$(find "$PROJECT/Assets" -type f -name '*.mat' | wc -l | tr -d ' ')"
            echo "SHADERS=$(find "$PROJECT/Assets" -type f -name '*.shader' | wc -l | tr -d ' ')"
            echo "TEXTURES=$(find "$PROJECT/Assets" -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.tga' \) | wc -l | tr -d ' ')"
          } | tee "$OUTPUT/recovery-summary.txt"

      - name: Sanitize recovered Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.recover.outputs.project }}"

          find "$PROJECT/Assets" \
            -type f \
            \( \
              -iname '*.so' \
              -o -iname '*.aar' \
              -o -iname '*.jar' \
              -o -iname '*.apk' \
            \) \
            -delete || true

          rm -rf \
            "$PROJECT/Assets/Plugins/Android" \
            || true

          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          project = Path(os.environ["PROJECT"])
          assets = project / "Assets"

          moved = project.parent / "removed-runtime-dlls"

          moved.mkdir(
              parents=True,
              exist_ok=True
          )

          runtime_names = {
              "UnityEngine.dll",
              "UnityEngine.UI.dll",
              "UnityEngine.Networking.dll",
              "UnityEngine.Advertisements.Android.dll",
              "mscorlib.dll",
              "System.dll",
              "System.Core.dll",
              "Mono.Security.dll",
              "Assembly-CSharp.dll",
              "Assembly-UnityScript.dll",
          }

          for p in list(assets.rglob("*.dll")):

              if p.name not in runtime_names:
                  continue

              rel = p.relative_to(assets)
              dst = moved / rel

              dst.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              shutil.move(
                  str(p),
                  str(dst)
              )

              meta = Path(str(p) + ".meta")

              if meta.exists():
                  shutil.move(
                      str(meta),
                      str(dst) + ".meta"
                  )

              print("moved", rel)
          PY

          mkdir -p \
            "$PROJECT/Assets/NFSMWiOS/Editor"

          cp \
            "$OUTPUT/NFS-MW-VPREBORN-original-icon.png" \
            "$PROJECT/Assets/NFSMWiOS/app_icon.png"

          cat > \
            "$PROJECT/ProjectSettings/ProjectVersion.txt" \
            <<'EOF'
          m_EditorVersion: 2017.4.40f1
          m_EditorVersionWithRevision: 2017.4.40f1 (6e14067f8a9a)
          EOF

      - name: Repair old Unity 5.6 scripts before migration
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.recover.outputs.project }}"

          find "$PROJECT/Assets" \
            -type f \
            -path '*/Properties/AssemblyInfo.cs' \
            -delete || true

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT"])

          for p in (project / "Assets").rglob("*.cs"):

              s = p.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              old = s

              s = re.sub(
                  r'^\s*using\s+UnityScript\s*;\s*$',
                  '',
                  s,
                  flags=re.M
              )

              if re.search(
                  r'^\s*using\s+System\.Diagnostics\s*;',
                  s,
                  flags=re.M
              ):
                  s = re.sub(
                      r'(?<![\w.])Debug\.',
                      'UnityEngine.Debug.',
                      s
                  )

              s = s.replace(
                  'UnityEngine.Advertisements.Android',
                  'UnityEngine.Advertisements'
              )

              if s != old:
                  p.write_text(
                      s,
                      encoding="utf-8"
                  )
          PY

          mkdir -p \
            "$PROJECT/Assets/NFSMWiOS"

          cat > \
            "$PROJECT/Assets/NFSMWiOS/UnityAdsCompatibilityStub.cs" \
            <<'CS'
          using System;

          namespace UnityEngine.Advertisements
          {
              public enum ShowResult
              {
                  Failed,
                  Skipped,
                  Finished
              }

              public sealed class ShowOptions
              {
                  public Action<ShowResult> resultCallback;
              }

              public static class Advertisement
              {
                  public static bool isSupported
                  {
                      get { return true; }
                  }

                  public static bool isInitialized
                  {
                      get { return true; }
                  }

                  public static bool IsInitialized()
                  {
                      return true;
                  }

                  public static void Initialize(
                      string gameId
                  )
                  {
                  }

                  public static void Initialize(
                      string gameId,
                      bool testMode
                  )
                  {
                  }

                  public static bool IsReady()
                  {
                      return true;
                  }

                  public static bool IsReady(
                      string placementId
                  )
                  {
                      return true;
                  }

                  public static void Show()
                  {
                  }

                  public static void Show(
                      string placementId
                  )
                  {
                  }

                  public static void Show(
                      ShowOptions options
                  )
                  {
                      if (
                          options != null &&
                          options.resultCallback != null
                      )
                      {
                          options.resultCallback(
                              ShowResult.Finished
                          );
                      }
                  }

                  public static void Show(
                      string placementId,
                      ShowOptions options
                  )
                  {
                      if (
                          options != null &&
                          options.resultCallback != null
                      )
                      {
                          options.resultCallback(
                              ShowResult.Finished
                          );
                      }
                  }
              }
          }
          CS

      - name: Setup Node 22 and Unity licensing helper
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Unity Hub and activation helper
        shell: bash
        run: |
          set -euo pipefail

          test -n "${UNITY_USERNAME:-}" || {
            echo "::error::UNITY_USERNAME secret missing."
            exit 1
          }

          test -n "${UNITY_PASSWORD:-}" || {
            echo "::error::UNITY_PASSWORD secret missing."
            exit 1
          }

          npm install -g \
            @rage-against-the-pixel/unity-cli

          sudo install \
            -d \
            -m 0755 \
            /etc/apt/keyrings

          curl -fsSL \
            https://hub.unity3d.com/linux/keys/public \
            | sudo gpg \
                --dearmor \
                -o /etc/apt/keyrings/unityhub.gpg

          echo \
            "deb [arch=amd64 signed-by=/etc/apt/keyrings/unityhub.gpg] https://hub.unity3d.com/linux/repos/deb stable main" \
            | sudo tee \
                /etc/apt/sources.list.d/unityhub.list \
                >/dev/null

          sudo apt-get update \
            -o Acquire::Retries=4 \
            || true

          sudo apt-get install -y \
            unityhub

          HUB_CMD="$(
            command -v unityhub
          )"

          sudo mkdir -p \
            /opt/unityhub

          sudo tee \
            /opt/unityhub/unityhub \
            >/dev/null <<EOF
          #!/bin/bash
          exec xvfb-run -a "$HUB_CMD" --no-sandbox --headless "\$@"
          EOF

          sudo chmod +x \
            /opt/unityhub/unityhub

          echo \
            "UNITY_HUB_PATH=/opt/unityhub/unityhub" \
            >> "$GITHUB_ENV"

      - name: Activate Unity Personal
        shell: bash
        env:
          UNITY_HUB_PATH: /opt/unityhub/unityhub
        run: |
          set -euo pipefail

          CLIENT="$(
            find \
              /usr \
              /opt \
              "$HOME" \
              -type f \
              -name 'Unity.Licensing.Client' \
              2>/dev/null \
              | head -1
          )"

          if [ -n "${CLIENT:-}" ]; then

            CLIENT_DIR="$(
              dirname "$CLIENT"
            )"

            sudo rm -rf \
              /opt/unityhub/UnityLicensingClient

            sudo mkdir -p \
              /opt/unityhub/UnityLicensingClient

            sudo cp -a \
              "$CLIENT_DIR"/. \
              /opt/unityhub/UnityLicensingClient/

            sudo chmod +x \
              /opt/unityhub/UnityLicensingClient/Unity.Licensing.Client \
              || true
          fi

          GLOBAL_NODE_MODULES="$(
            npm root -g
          )"

          LICENSE_MODULE="$GLOBAL_NODE_MODULES/@rage-against-the-pixel/unity-cli/dist/license-client.js"

          test -f "$LICENSE_MODULE"

          export LICENSE_MODULE

          node <<'NODE'
          const {
            LicensingClient,
            LicenseType
          } = require(
            process.env.LICENSE_MODULE
          );

          async function main() {

            const client =
              new LicensingClient(
                '6.x'
              );

            await client.Activate(
              {
                licenseType:
                  LicenseType.personal,

                username:
                  process.env.UNITY_USERNAME,

                password:
                  process.env.UNITY_PASSWORD
              },
              true
            );

            console.log(
              "UNITY PERSONAL ACTIVATION: SUCCESS"
            );
          }

          main().catch((e) => {

            console.error(
              "UNITY PERSONAL ACTIVATION FAILED"
            );

            console.error(
              e && e.stack
                ? e.stack
                : e
            );

            process.exit(1);

          });
          NODE

      - name: Install Unity 2017.4.40f1
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$WORK/unity-2017"

          URL="https://download.unity3d.com/download_unity/${MIGRATION_CHANGESET}/LinuxEditorInstaller/Unity-${MIGRATION_UNITY}.tar.xz"

          curl -fL \
            --retry 5 \
            --retry-delay 5 \
            "$URL" \
            -o "$WORK/Unity-${MIGRATION_UNITY}.tar.xz"

          tar -xJf \
            "$WORK/Unity-${MIGRATION_UNITY}.tar.xz" \
            -C "$WORK/unity-2017"

          UNITY2017="$(
            find "$WORK/unity-2017" \
              -type f \
              -path '*/Editor/Unity' \
              -perm -111 \
              -print \
              | head -1
          )"

          if [ -z "$UNITY2017" ]; then
            echo "::error::Unity 2017 not found."
            exit 1
          fi

          echo "UNITY2017=$UNITY2017" \
            >> "$GITHUB_ENV"

      - name: Unity 2017 compatibility migration
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.recover.outputs.project }}"
          LOG="$OUTPUT/unity-2017-migration.log"

          rm -rf \
            "$PROJECT/Library/ScriptAssemblies" \
            "$PROJECT/Temp" \
            "$PROJECT/obj" \
            2>/dev/null || true

          set +e

          timeout 75m \
            xvfb-run -a \
            "$UNITY2017" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$PROJECT" \
            -logFile "$LOG"

          RC=$?

          set -e

          echo \
            "UNITY2017_EXIT_CODE=$RC"

          if grep -qE \
            'error CS[0-9]+|Scripts have compiler errors|Compilation failed' \
            "$LOG"
          then
            grep -nEi \
              -A 10 \
              -B 5 \
              'error CS[0-9]+|Scripts have compiler errors|Compilation failed' \
              "$LOG" \
              | tail -1000

            exit 1
          fi

          echo \
            "UNITY 2017 COMPILE GATE: CLEAN"

      - name: Prepare migrated project for Unity 2019 iOS
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.recover.outputs.project }}"

          mkdir -p \
            "$PROJECT/Packages"

          cat > \
            "$PROJECT/Packages/manifest.json" \
            <<'JSON'
          {
            "dependencies": {
              "com.unity.ugui": "1.0.0",
              "com.unity.modules.ai": "1.0.0",
              "com.unity.modules.animation": "1.0.0",
              "com.unity.modules.assetbundle": "1.0.0",
              "com.unity.modules.audio": "1.0.0",
              "com.unity.modules.cloth": "1.0.0",
              "com.unity.modules.director": "1.0.0",
              "com.unity.modules.imageconversion": "1.0.0",
              "com.unity.modules.imgui": "1.0.0",
              "com.unity.modules.jsonserialize": "1.0.0",
              "com.unity.modules.particlesystem": "1.0.0",
              "com.unity.modules.physics": "1.0.0",
              "com.unity.modules.physics2d": "1.0.0",
              "com.unity.modules.screencapture": "1.0.0",
              "com.unity.modules.terrain": "1.0.0",
              "com.unity.modules.terrainphysics": "1.0.0",
              "com.unity.modules.tilemap": "1.0.0",
              "com.unity.modules.ui": "1.0.0",
              "com.unity.modules.uielements": "1.0.0",
              "com.unity.modules.umbra": "1.0.0",
              "com.unity.modules.unityanalytics": "1.0.0",
              "com.unity.modules.unitywebrequest": "1.0.0",
              "com.unity.modules.unitywebrequestassetbundle": "1.0.0",
