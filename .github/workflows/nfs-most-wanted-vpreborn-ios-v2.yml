      - name: v3.7 Repair graphics materials and road collisions
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.recover.outputs.project }}"

          echo "===== NFS MW v3.7 GRAPHICS + COLLISION REPAIR ====="

          mkdir -p \
            "$PROJECT/Assets/NFSMWiOS/Editor"

          cat > \
            "$PROJECT/Assets/NFSMWiOS/Editor/NFSMWGraphicsRepair.cs" \
            <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;

          using UnityEditor;
          using UnityEditor.SceneManagement;

          using UnityEngine;
          using UnityEngine.SceneManagement;

          public static class NFSMWGraphicsRepair
          {
              private static int materialsScanned;
              private static int materialsRepaired;
              private static int collidersAdded;
              private static int collidersEnabled;

              public static void Run()
              {
                  Debug.Log(
                      "===== NFS MW v3.7 REPAIR START ====="
                  );

                  RepairMaterials();
                  RepairScenes();

                  AssetDatabase.SaveAssets();
                  AssetDatabase.Refresh();

                  Debug.Log(
                      "===== NFS MW v3.7 REPAIR RESULT ===== " +
                      "materialsScanned=" +
                      materialsScanned +
                      " materialsRepaired=" +
                      materialsRepaired +
                      " collidersAdded=" +
                      collidersAdded +
                      " collidersEnabled=" +
                      collidersEnabled
                  );
              }

              private static void RepairMaterials()
              {
                  string[] guids =
                      AssetDatabase.FindAssets(
                          "t:Material"
                      );

                  foreach (
                      string guid
                      in guids
                  )
                  {
                      string path =
                          AssetDatabase.GUIDToAssetPath(
                              guid
                          );

                      Material material =
                          AssetDatabase.LoadAssetAtPath<
                              Material
                          >(
                              path
                          );

                      if (material == null)
                          continue;

                      materialsScanned++;

                      Shader oldShader =
                          material.shader;

                      bool broken =
                          oldShader == null;

                      bool dummy =
                          IsAssetRipperDummyShader(
                              oldShader
                          );

                      bool errorShader =
                          oldShader != null &&
                          oldShader.name ==
                          "Hidden/InternalErrorShader";

                      if (
                          !broken &&
                          !dummy &&
                          !errorShader
                      )
                      {
                          continue;
                      }

                      string oldShaderName =
                          oldShader != null
                              ? oldShader.name
                              : "";

                      if (
                          Contains(
                              oldShaderName,
                              "Skybox"
                          ) ||
                          Contains(
                              material.name,
                              "Skybox"
                          )
                      )
                      {
                          continue;
                      }

                      Texture primaryTexture =
                          FindBestTexture(
                              material,
                              oldShader
                          );

                      Color oldColor =
                          Color.white;

                      if (
                          material.HasProperty(
                              "_Color"
                          )
                      )
                      {
                          oldColor =
                              material.GetColor(
                                  "_Color"
                              );
                      }

                      Shader replacement =
                          FindReplacementShader(
                              material,
                              oldShaderName
                          );

                      if (
                          replacement == null
                      )
                      {
                          Debug.LogWarning(
                              "No replacement shader for " +
                              path +
                              " oldShader=" +
                              oldShaderName
                          );

                          continue;
                      }

                      material.shader =
                          replacement;

                      if (
                          primaryTexture != null &&
                          material.HasProperty(
                              "_MainTex"
                          )
                      )
                      {
                          material.SetTexture(
                              "_MainTex",
                              primaryTexture
                          );
                      }

                      if (
                          material.HasProperty(
                              "_Color"
                          )
                      )
                      {
                          material.SetColor(
                              "_Color",
                              oldColor
                          );
                      }

                      if (
                          replacement.name ==
                          "Standard"
                      )
                      {
                          SetupStandardMaterial(
                              material,
                              oldShaderName
                          );
                      }

                      EditorUtility.SetDirty(
                          material
                      );

                      materialsRepaired++;

                      Debug.Log(
                          "Repaired material: " +
                          path +
                          " | " +
                          oldShaderName +
                          " -> " +
                          replacement.name +
                          " | texture=" +
                          (
                              primaryTexture != null
                                  ? primaryTexture.name
                                  : "NONE"
                          )
                      );
                  }
              }

              private static bool IsAssetRipperDummyShader(
                  Shader shader
              )
              {
                  if (shader == null)
                      return false;

                  string path =
                      AssetDatabase.GetAssetPath(
                          shader
                      );

                  if (
                      String.IsNullOrEmpty(
                          path
                      ) ||
                      !File.Exists(
                          path
                      )
                  )
                  {
                      return false;
                  }

                  try
                  {
                      string text =
                          File.ReadAllText(
                              path
                          );

                      return text.Contains(
                          "DummyShaderTextExporter"
                      );
                  }
                  catch
                  {
                      return false;
                  }
              }

              private static Texture FindBestTexture(
                  Material material,
                  Shader shader
              )
              {
                  if (material == null)
                      return null;

                  string[] preferredNames =
                  {
                      "_MainTex",
                      "_BaseMap",
                      "_BaseTex",
                      "_Diffuse",
                      "_DiffuseTex",
                      "_Albedo",
                      "_AlbedoTex",
                      "_Texture",
                      "_Tex",
                      "_ColorMap",
                      "_DetailTex"
                  };

                  foreach (
                      string name
                      in preferredNames
                  )
                  {
                      if (
                          material.HasProperty(
                              name
                          )
                      )
                      {
                          Texture tex =
                              material.GetTexture(
                                  name
                              );

                          if (tex != null)
                              return tex;
                      }
                  }

                  if (shader == null)
                      return null;

                  try
                  {
                      int count =
                          ShaderUtil
                              .GetPropertyCount(
                                  shader
                              );

                      for (
                          int i = 0;
                          i < count;
                          i++
                      )
                      {
                          if (
                              ShaderUtil
                                  .GetPropertyType(
                                      shader,
                                      i
                                  ) !=
                              ShaderUtil
                                  .ShaderPropertyType
                                  .TexEnv
                          )
                          {
                              continue;
                          }

                          string property =
                              ShaderUtil
                                  .GetPropertyName(
                                      shader,
                                      i
                                  );

                          Texture tex =
                              material.GetTexture(
                                  property
                              );

                          if (tex != null)
                              return tex;
                      }
                  }
                  catch
                  {
                  }

                  return null;
              }

              private static Shader FindReplacementShader(
                  Material material,
                  string oldShaderName
              )
              {
                  string combined =
                      (
                          material.name +
                          " " +
                          oldShaderName
                      ).ToLowerInvariant();

                  Shader shader;

                  if (
                      combined.Contains(
                          "ui"
                      ) ||
                      combined.Contains(
                          "hud"
                      ) ||
                      combined.Contains(
                          "button"
                      ) ||
                      combined.Contains(
                          "sprite"
                      )
                  )
                  {
                      shader =
                          Shader.Find(
                              "UI/Default"
                          );

                      if (shader != null)
                          return shader;
                  }

                  if (
                      combined.Contains(
                          "glass"
                      ) ||
                      combined.Contains(
                          "window"
                      ) ||
                      combined.Contains(
                          "transparent"
                      ) ||
                      combined.Contains(
                          "alpha"
                      )
                  )
                  {
                      shader =
                          Shader.Find(
                              "Legacy Shaders/Transparent/Diffuse"
                          );

                      if (shader != null)
                          return shader;

                      shader =
                          Shader.Find(
                              "Unlit/Transparent"
                          );

                      if (shader != null)
                          return shader;
                  }

                  if (
                      combined.Contains(
                          "particle"
                      )
                  )
                  {
                      shader =
                          Shader.Find(
                              "Particles/Standard Unlit"
                          );

                      if (shader != null)
                          return shader;
                  }

                  shader =
                      Shader.Find(
                          "Standard"
                      );

                  if (shader != null)
                      return shader;

                  shader =
                      Shader.Find(
                          "Unlit/Texture"
                      );

                  return shader;
              }

              private static void SetupStandardMaterial(
                  Material material,
                  string oldShaderName
              )
              {
                  string name =
                      (
                          material.name +
                          " " +
                          oldShaderName
                      ).ToLowerInvariant();

                  bool transparent =
                      name.Contains(
                          "glass"
                      ) ||
                      name.Contains(
                          "window"
                      ) ||
                      name.Contains(
                          "transparent"
                      ) ||
                      name.Contains(
                          "alpha"
                      );

                  if (!transparent)
                  {
                      material.SetFloat(
                          "_Mode",
                          0f
                      );

                      material.SetInt(
                          "_SrcBlend",
                          (
                              int
                          )
                          UnityEngine
                              .Rendering
                              .BlendMode
                              .One
                      );

                      material.SetInt(
                          "_DstBlend",
                          (
                              int
                          )
                          UnityEngine
                              .Rendering
                              .BlendMode
                              .Zero
                      );

                      material.SetInt(
                          "_ZWrite",
                          1
                      );

                      material.DisableKeyword(
                          "_ALPHATEST_ON"
                      );

                      material.DisableKeyword(
                          "_ALPHABLEND_ON"
                      );

                      material.DisableKeyword(
                          "_ALPHAPREMULTIPLY_ON"
                      );

                      material.renderQueue =
                          -1;

                      return;
                  }

                  material.SetFloat(
                      "_Mode",
                      3f
                  );

                  material.SetInt(
                      "_SrcBlend",
                      (
                          int
                      )
                      UnityEngine
                          .Rendering
                          .BlendMode
                          .One
                  );

                  material.SetInt(
                      "_DstBlend",
                      (
                          int
                      )
                      UnityEngine
                          .Rendering
                          .BlendMode
                          .OneMinusSrcAlpha
                  );

                  material.SetInt(
                      "_ZWrite",
                      0
                  );

                  material.DisableKeyword(
                      "_ALPHATEST_ON"
                  );

                  material.DisableKeyword(
                      "_ALPHABLEND_ON"
                  );

                  material.EnableKeyword(
                      "_ALPHAPREMULTIPLY_ON"
                  );

                  material.renderQueue =
                      3000;
              }

              private static void RepairScenes()
              {
                  string[] scenes =
                      AssetDatabase
                          .FindAssets(
                              "t:Scene"
                          )
                          .Select(
                              AssetDatabase
                                  .GUIDToAssetPath
                          )
                          .Where(
                              x =>
                                  x.EndsWith(
                                      ".unity",
                                      StringComparison
                                          .OrdinalIgnoreCase
                                  )
                          )
                          .ToArray();

                  foreach (
                      string scenePath
                      in scenes
                  )
                  {
                      Scene scene;

                      try
                      {
                          scene =
                              EditorSceneManager
                                  .OpenScene(
                                      scenePath,
                                      OpenSceneMode.Single
                                  );
                      }
                      catch (
                          Exception ex
                      )
                      {
                          Debug.LogWarning(
                              "Could not open scene " +
                              scenePath +
                              ": " +
                              ex.Message
                          );

                          continue;
                      }

                      bool changed =
                          false;

                      foreach (
                          GameObject root
                          in scene
                              .GetRootGameObjects()
                      )
                      {
                          Transform[] objects =
                              root
                                  .GetComponentsInChildren<
                                      Transform
                                  >(
                                      true
                                  );

                          foreach (
                              Transform t
                              in objects
                          )
                          {
                              GameObject go =
                                  t.gameObject;

                              if (
                                  !LooksLikeDriveSurface(
                                      go
                                  )
                              )
                              {
                                  continue;
                              }

                              Rigidbody body =
                                  go.GetComponentInParent<
                                      Rigidbody
                                  >();

                              if (body != null)
                                  continue;

                              Collider existing =
                                  go.GetComponent<
                                      Collider
                                  >();

                              if (
                                  existing != null
                              )
                              {
                                  if (
                                      !existing.enabled
                                  )
                                  {
                                      existing.enabled =
                                          true;

                                      collidersEnabled++;

                                      changed =
                                          true;
                                  }

                                  if (
                                      existing.isTrigger
                                  )
                                  {
                                      existing.isTrigger =
                                          false;

                                      changed =
                                          true;
                                  }

                                  continue;
                              }

                              MeshFilter meshFilter =
                                  go.GetComponent<
                                      MeshFilter
                                  >();

                              if (
                                  meshFilter == null ||
                                  meshFilter.sharedMesh ==
                                  null
                              )
                              {
                                  continue;
                              }

                              MeshRenderer renderer =
                                  go.GetComponent<
                                      MeshRenderer
                                  >();

                              if (
                                  renderer == null
                              )
                              {
                                  continue;
                              }

                              MeshCollider collider =
                                  go.AddComponent<
                                      MeshCollider
                                  >();

                              collider.sharedMesh =
                                  meshFilter.sharedMesh;

                              collider.convex =
                                  false;

                              collider.isTrigger =
                                  false;

                              collidersAdded++;

                              changed =
                                  true;

                              Debug.Log(
                                  "Added road collider: " +
                                  GetHierarchyPath(
                                      t
                                  )
                              );
                          }
                      }

                      if (changed)
                      {
                          EditorSceneManager
                              .MarkSceneDirty(
                                  scene
                              );

                          EditorSceneManager
                              .SaveScene(
                                  scene
                              );
                      }
                  }
              }

              private static bool LooksLikeDriveSurface(
                  GameObject go
              )
              {
                  string check =
                      go.name
                          .ToLowerInvariant();

                  Renderer renderer =
                      go.GetComponent<
                          Renderer
                      >();

                  if (renderer != null)
                  {
                      Material[] materials =
                          renderer
                              .sharedMaterials;

                      foreach (
                          Material mat
                          in materials
                      )
                      {
                          if (mat == null)
                              continue;

                          check +=
                              " " +
                              mat.name
                                  .ToLowerInvariant();

                          if (
                              mat.shader != null
                          )
                          {
                              check +=
                                  " " +
                                  mat.shader.name
                                      .ToLowerInvariant();
                          }
                      }
                  }

                  string[] words =
                  {
                      "road",
                      "asphalt",
                      "street",
                      "highway",
                      "ground",
                      "track",
                      "floor",
                      "pavement"
                  };

                  foreach (
                      string word
                      in words
                  )
                  {
                      if (
                          check.Contains(
                              word
                          )
                      )
                      {
                          return true;
                      }
                  }

                  return false;
              }

              private static string GetHierarchyPath(
                  Transform transform
              )
              {
                  string path =
                      transform.name;

                  Transform parent =
                      transform.parent;

                  while (
                      parent != null
                  )
                  {
                      path =
                          parent.name +
                          "/" +
                          path;

                      parent =
                          parent.parent;
                  }

                  return path;
              }

              private static bool Contains(
                  string value,
                  string part
              )
              {
                  if (
                      String.IsNullOrEmpty(
                          value
                      )
                  )
                  {
                      return false;
                  }

                  return value.IndexOf(
                      part,
                      StringComparison
                          .OrdinalIgnoreCase
                  ) >= 0;
              }
          }
          CS

          echo \
            "===== PATCH BUILD SCRIPT TO RUN v3.7 REPAIR ====="

          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(
              os.environ["PROJECT"]
          )

          build = (
              project /
              "Assets" /
              "NFSMWiOS" /
              "Editor" /
              "NFSMWiOSBuild.cs"
          )

          text = build.read_text(
              encoding="utf-8"
          )

          if (
              "NFSMWGraphicsRepair.Run();" not in text
          ):
              needle = (
                  "                  ApplyOriginalIcon();"
              )

              replacement = (
                  "                  NFSMWGraphicsRepair.Run();\n\n"
                  "                  ApplyOriginalIcon();"
              )

              if needle not in text:
                  raise SystemExit(
                      "Could not find ApplyOriginalIcon() in build script"
                  )

              text = text.replace(
                  needle,
                  replacement,
                  1
              )

              build.write_text(
                  text,
                  encoding="utf-8"
              )

          print(
              "NFSMWGraphicsRepair.Run() installed"
          )
          PY

          echo \
            "===== VERIFY REPAIR SCRIPT ====="

          grep -n \
            'DummyShaderTextExporter\|RepairMaterials\|RepairScenes' \
            "$PROJECT/Assets/NFSMWiOS/Editor/NFSMWGraphicsRepair.cs"

          grep -n \
            'NFSMWGraphicsRepair.Run' \
            "$PROJECT/Assets/NFSMWiOS/Editor/NFSMWiOSBuild.cs"

          echo \
            "v3.7 graphics/collision repair installed"
